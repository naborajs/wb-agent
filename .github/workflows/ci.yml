name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      DATABASE_URL_SYNC: sqlite:///:memory:
      LLM_PROVIDER: simulator
      WHATSAPP_PROVIDER: simulator
      PYTHONPATH: backend:.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock aiosqlite

      - name: Run Backend Unit & Pipeline Tests
        run: |
          python -m pytest backend/tests/test_edith_sales_pipeline.py backend/tests/unit -v --tb=short

  frontend-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Frontend Dependencies
        working-directory: ./dashboard
        run: npm ci || npm install

      - name: Build Next.js Dashboard
        working-directory: ./dashboard
        run: npm run build
