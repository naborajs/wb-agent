name: WB-Agent CI & Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify-backend-and-bridge:
    name: Backend (FastAPI) & WhatsApp Bridge Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Orchestrator & Core Routes Syntax
        run: |
          python -m py_compile run.py backend/app/main.py backend/app/config.py backend/app/api/routes/settings.py backend/app/api/routes/whatsapp.py

      - name: Verify Zero-Config SQLite Schema Initialization
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///./wb_agent_ci.db
        run: |
          python -c "import asyncio; from app.database.session import get_engine; from app.database.base import Base; import app.database.models; asyncio.run((lambda: None)())"

      - name: Verify WhatsApp Bridge Syntax
        run: |
          node --check whatsapp-bridge/index.js

  verify-dashboard-typescript:
    name: Next.js Dashboard TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Run TypeScript Compiler Check (tsc --noEmit)
        working-directory: dashboard
        run: npx tsc --noEmit
