[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-agent"
version = "0.1.0"
description = "Autonomous, context-aware AI Sales Agent platform for WhatsApp B2B conversion"
authors = [{ name = "WB-Agent Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.2",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "websockets>=12.0",
    "numpy>=1.26.4",
    "openai>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
